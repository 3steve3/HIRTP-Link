name: CI Build and Simulation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HTML Converter
        run: sudo apt-get update && sudo apt-get install -y aha

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Run simulation and stream logs
        run: |
          export COMPOSE_COLOR=1
          stdbuf -oL docker compose logs -f > simulation.log &
          LOGGER_PID=$!
          
          sleep 120
          
          kill $LOGGER_PID || true
          sleep 2

      - name: Convert Logs to Pretty HTML
        if: always()
        run: |
          cat simulation.log | aha --black > simulation.html
          
          ls -lh simulation.html
          head -n 20 simulation.html

      - name: Cleanup containers
        if: always()
        run: docker compose down

      - name: Create GitHub Release
        id: create_release
        if: always()
        uses: actions/create-release@v1
        with:
          tag_name: simulation-logs-${{ github.run_number }}
          release_name: Simulation Logs (Run ${{ github.run_number }})
          body: "View the attached HTML file for colorized simulation logs."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pretty HTML Log
        if: always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./simulation.html
          asset_name: simulation_logs.html
          asset_content_type: text/html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
